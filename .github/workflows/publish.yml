name: Publish

# Publishes bipit to npm on a GitHub Release (or manual dispatch).
#
# Auth: npm Trusted Publishing (OIDC) — no long-lived secret.
# Bootstrap only: npm will not let you configure a trusted publisher until the
# package exists, so the FIRST publish needs a token. Add a short-lived granular
# token as the repo secret NPM_TOKEN, run this workflow once, then:
#   1. configure the trusted publisher at
#      https://www.npmjs.com/package/@konten-studio/bipit/access -> "Trusted Publisher"
#      (GitHub Actions | owner: konten-studio | repo: bipit | workflow: publish.yml)
#   2. delete the NPM_TOKEN secret and revoke the token
# Every release after that authenticates via OIDC with nothing stored.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # No registry-url here on purpose: setup-node's .npmrc auth stub would
      # shadow OIDC. Registry + access come from package.json publishConfig.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Version matches release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag ($tag) does not match package.json version ($pkg)" >&2
            exit 1
          fi

      - run: npm test

      - name: Publish via token (bootstrap)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm publish
          npm config delete //registry.npmjs.org/:_authToken

      - name: Publish via OIDC (trusted publishing)
        if: ${{ env.NPM_TOKEN == '' }}
        run: npm publish
